aid: thingsthinking
name: Thingsthinking
description: >-
  Thingsthinking GmbH is a Karlsruhe, Germany-based semantic AI company and the
  maker of semantha, an adaptive AI platform for text-driven business processes.
  semantha applies semantic natural-language understanding to documents and
  unstructured text for use cases such as contract and document analysis,
  semantic comparison, enterprise search, requirements and specifications
  analysis, classification and clustering, ESG report analysis, compliance
  management, correspondence automation, and risk analysis in underwriting. The
  platform is delivered as a comprehensive REST API with a first-party Python
  SDK (semantha-sdk), authenticated via OAuth2 client credentials / OpenID
  Connect (with a legacy per-domain API key), hosted exclusively in the EU and
  operated in a GDPR/DSGVO-compliant manner. Thingsthinking was surfaced as a
  portfolio company of Earlybird and has since been acquired by Aleph Alpha.
