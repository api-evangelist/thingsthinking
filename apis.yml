apis:
- name: semantha REST API
  description: >-
    semantha's standardized RESTful web service for semantic processing of text
    documents and structured data extraction. Resources are organized under
    /api (info, domains/{domain}/referencedocuments, settings, roles,
    currentuser) and are consumed out-of-the-box or via the first-party Python
    SDK. The service is stateless per request (processed documents are not
    persisted) and enforces HTTPS. The production API base is a per-tenant
    semantha server URL of the form https://<tenant>/tt-platform-server/api.
  humanURL: https://www.semantha.de/experten/
  baseURL: https://www.semantha.de
